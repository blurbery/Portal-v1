<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Requests | Portal</title>
  <style>
    :root{color-scheme:dark;--bg:#090a10;--surface:#12131c;--surface2:#1b1c29;--border:#2a2b3c;--text:#f5f4ff;--muted:#9a99ad;--accent:#6c63ff;--success:#4ade80;--danger:#f87171}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}
    header{height:64px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:1rem;padding:0 1.25rem;position:sticky;top:0;background:rgba(9,10,16,.96);backdrop-filter:blur(12px);z-index:2}header strong{font-size:1.05rem}header span{color:var(--muted);font-size:.82rem}.back{color:var(--muted);font-size:.85rem}.back:hover{color:var(--text)}
    main{max-width:1120px;margin:0 auto;padding:1.25rem}.hero{display:flex;align-items:end;justify-content:space-between;gap:1rem;margin-bottom:1rem}.hero h1{margin:0 0 .3rem;font-size:1.55rem}.hero p{margin:0;color:var(--muted)}
    nav{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem;border-bottom:1px solid var(--border);padding-bottom:.75rem}nav button,.btn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:9px;padding:.55rem .8rem;cursor:pointer;font:inherit;font-size:.82rem}nav button.active,.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}button:disabled{opacity:.55;cursor:wait}
    .toolbar{display:flex;gap:.55rem;margin-bottom:1rem}.toolbar input,.modal input,.modal textarea,.modal select{flex:1;min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:.7rem;color:var(--text);font:inherit}.toolbar input:focus,.modal input:focus,.modal textarea:focus{outline:2px solid rgba(108,99,255,.45)}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:1rem}.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}.poster{width:100%;aspect-ratio:2/3;object-fit:cover;background:var(--surface2);display:block}.poster-empty{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:2rem}.copy{padding:.75rem}.copy strong{display:block;line-height:1.3}.copy small{display:block;color:var(--muted);margin-top:.3rem}.copy .btn{width:100%;margin-top:.7rem}.empty,.error,.loading{padding:2rem;text-align:center;color:var(--muted)}.error{color:var(--danger)}.list{display:grid;gap:.65rem}.row{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.8rem;display:flex;justify-content:space-between;gap:1rem}.row small{display:block;color:var(--muted);margin-top:.3rem}.status{color:var(--success);font-size:.78rem;white-space:nowrap}.status.pending{color:#facc15}.status.failed{color:var(--danger)}
    .request-state{display:flex;align-items:center;gap:.45rem;margin-top:.7rem;font-size:.78rem;font-weight:700}.request-state.pending{color:#facc15}.request-state.available{color:var(--success)}.request-state.requestable{color:var(--muted)}
    .card .btn.requested{background:rgba(234,179,8,.18);border-color:#eab308;color:#facc15;cursor:default}.card .btn.available{background:rgba(74,222,128,.14);border-color:rgba(74,222,128,.45);color:var(--success);cursor:default}
    .modal-wrap{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:1rem;z-index:5}.modal-wrap.open{display:flex}.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:1.15rem}.modal-head{display:flex;justify-content:space-between;gap:1rem;align-items:start}.modal h2{font-size:1.15rem;margin:.1rem 0 .35rem}.modal p{color:var(--muted);line-height:1.5}.close{background:transparent;border:0;color:var(--muted);font-size:1.2rem;cursor:pointer}.field{display:grid;gap:.35rem;margin-top:.8rem}.field label{font-size:.78rem;color:var(--muted)}.actions{display:flex;justify-content:flex-end;gap:.55rem;margin-top:1rem;flex-wrap:wrap}
    @media(max-width:600px){main{padding:.9rem}.hero{display:block}.hero h1{font-size:1.3rem}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:.65rem}.copy{padding:.55rem}.copy strong{font-size:.82rem}.toolbar{display:flex}.row{display:block}.row .status{display:block;margin-top:.45rem}}
  </style>
</head>
<body>
  <header><a class="back" href="/dashboard">← Portal</a><strong>Requests</strong><span>Discover, request, and track media in Portal</span></header>
  <main>
    <section class="hero"><div><h1 id="pageTitle">Discover</h1><p id="pageSubtitle">Search the configured Seerr catalogue without leaving Portal.</p></div></section>
    <nav aria-label="Seerr areas">
      <button class="active" data-view="discover">Discover</button><button data-view="movies">Movies</button><button data-view="tv">TV Shows</button><button data-view="requests">My Requests</button><button data-view="issues">My Issues</button>
    </nav>
    <section id="discoverView"><div class="toolbar"><input id="searchInput" placeholder="Search movies and TV shows…"><button class="btn primary" id="searchButton">Search</button></div><div id="discoverGrid" class="grid"><div class="loading">Loading Discover…</div></div></section>
    <section id="listView" style="display:none"><div id="listContent" class="list"></div></section>
  </main>
  <div class="modal-wrap" id="mediaModal" onclick="if(event.target===this)closeMedia()"><div class="modal" id="mediaModalBody"></div></div>
  <div class="modal-wrap" id="issueModal" onclick="if(event.target===this)closeIssue()"><div class="modal"><div class="modal-head"><div><h2>Report media issue</h2><p>Submit this issue to Seerr. It will be attached to the selected media item.</p></div><button class="close" onclick="closeIssue()">×</button></div><div class="field"><label>Issue type</label><select id="issueType"><option value="1">Playback problem</option><option value="2">Missing or unavailable</option><option value="3">Other</option></select></div><div class="field"><label>Message</label><textarea id="issueMessage" rows="5" placeholder="Describe the problem"></textarea></div><div class="actions"><button class="btn" onclick="closeIssue()">Cancel</button><button class="btn primary" id="issueSubmit">Submit issue</button></div></div></div>
  <script>
    const state={view:'discover',media:null,config:{categories:[]},items:[],status:new Map(),requesting:false};
    const $=id=>document.getElementById(id);
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const poster=v=>v?`<img class="poster" loading="lazy" src="https://image.tmdb.org/t/p/w342${esc(v)}" alt="">`:'<div class="poster poster-empty">▣</div>';
    async function api(url,opts){const r=await fetch(url,opts);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d}
    function titleFor(item){return item?.title||item?.name||item?.media?.title||item?.media?.name||'Untitled'}
    function typeFor(item){return item?.mediaType||item?.media?.mediaType||(item?.firstAirDate||item?.media?.firstAirDate?'tv':'movie')}
    function mediaKey(item){return `${typeFor(item)}:${String(item?.id||item?.mediaId||item?.tmdbId||'')}`}\n    function statusFor(item){const key=mediaKey(item);const value=state.status.get(key);if(value)return value;const title=titleFor(item).trim().toLowerCase();for(const [k,v] of state.status){if(v.title&&v.title.trim().toLowerCase()===title)return v}return null}\n    function requestStateMarkup(item){const s=statusFor(item);if(!s)return '<span class="request-state requestable">Available to request</span>';const raw=String(s.requestStatus||s.status||s.mediaStatus||'').toLowerCase();if(/available|complete|download|5/.test(raw)||String(s.mediaStatus)==='5')return '<span class="request-state available">✓ Available</span>';return '<span class="request-state pending">− Pending request</span>'}\n    function renderCards(items){const grid=$('discoverGrid');state.items=items||[];if(!state.items.length){grid.innerHTML='<div class="empty">No media found.</div>';return}grid.innerHTML=state.items.map((item,i)=>`<article class="card">${poster(item.posterPath||item.media?.posterPath)}<div class="copy"><strong>${esc(titleFor(item))}</strong><small>${typeFor(item)==='tv'?'TV Show':'Movie'}${item.releaseDate||item.firstAirDate?' · '+esc(String(item.releaseDate||item.firstAirDate).slice(0,4)):''}</small>${requestStateMarkup(item)}<button class="btn primary" onclick="openMedia(${i})">View</button></div></article>`).join('')}
    async function loadRequestStatus(){try{const d=await api('/api/seerr/request-status');state.status=new Map((d.results||[]).map(item=>[`${String(item.mediaType||'').toLowerCase()}:${String(item.mediaId||'')}`,item]));}catch(_){state.status=new Map()}}\n    async function loadDiscover(filter=''){try{const d=await api('/api/seerr/discover'+(filter?'?type='+encodeURIComponent(filter):''));renderCards((d.results||[]).filter(item=>!filter||typeFor(item)===filter));}catch(e){$('discoverGrid').innerHTML=`<div class="error">${esc(e.message)}</div>`}}\n    async function refreshDiscover(){await loadRequestStatus();if(state.view==='movies'||state.view==='tv'||state.view==='discover')await loadDiscover(state.view==='movies'?'movie':state.view==='tv'?'tv':'');}
    async function search(){const q=$('searchInput').value.trim();if(!q)return;const b=$('searchButton');b.disabled=true;try{const d=await api('/api/seerr/search?query='+encodeURIComponent(q));renderCards((d.results||[]).filter(item=>!['movies','tv'].includes(state.view)||typeFor(item)===(state.view==='tv'?'tv':'movie')))}catch(e){$('discoverGrid').innerHTML=`<div class="error">${esc(e.message)}</div>`}finally{b.disabled=false}}
    async function openMedia(index){const item=state.items[index];if(!item)return;const type=typeFor(item);$('mediaModalBody').innerHTML='<div class="loading">Loading details…</div>';$('mediaModal').classList.add('open');try{const detail=await api(`/api/seerr/${type==='tv'?'tv':'movie'}/${encodeURIComponent(item.id)}`);state.media={...item,...detail,mediaType:type};const options=(state.config.categories||[]).filter(category=>category.allowed&&((type==='tv'&&String(category.id).includes('shows'))||(type!=='tv'&&!String(category.id).includes('shows'))));const current=statusFor(state.media);const currentRaw=String(current?.requestStatus||current?.status||current?.mediaStatus||'').toLowerCase();const alreadyRequested=Boolean(current)&&!(/available|complete|download|5/.test(currentRaw)||String(current?.mediaStatus)==='5');$('mediaModalBody').innerHTML=`<div class="modal-head"><div><h2>${esc(titleFor(state.media))}</h2><p>${type==='tv'?'TV Show':'Movie'} · ${esc(state.media.overview||'No description available.')}</p></div><button class="close" onclick="closeMedia()">×</button></div>${options.length?`<div class="field"><label>Request category</label><select id="requestCategory">${options.map(category=>`<option value="${esc(category.id)}">${esc(category.label)}</option>`).join('')}</select></div>`:''}<div class="actions"><button class="btn ${alreadyRequested?'requested':''}" ${alreadyRequested?'disabled':''} id="requestMediaButton" onclick="requestMedia()">${alreadyRequested?'− Pending':'Request'}</button><button class="btn" onclick="openIssue()">Report issue</button></div>`}catch(e){$('mediaModalBody').innerHTML=`<div class="error">${esc(e.message)}<div class="actions"><button class="btn" onclick="closeMedia()">Close</button></div></div>`}}
    function closeMedia(){$('mediaModal').classList.remove('open')}
    async function requestMedia(){if(!state.media||state.requesting)return;const type=typeFor(state.media);const button=$('requestMediaButton');if(button?.disabled)return;const body={mediaType:type==='tv'?'tv':'movie',mediaId:state.media.id,title:titleFor(state.media),requestCategory:$('requestCategory')?.value||(type==='tv'?'shows':'movies')};if(type==='tv'&&Array.isArray(state.media.seasons))body.seasons=state.media.seasons.filter(s=>s.seasonNumber>0).map(s=>s.seasonNumber);state.requesting=true;if(button){button.disabled=true;button.textContent='Submitting…'}try{const result=await api('/api/seerr/requests',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});state.status.set(mediaKey(state.media),{mediaId:state.media.id,mediaType:body.mediaType,title:body.title,requestStatus:result.status||'pending'});if(button){button.className='btn requested';button.textContent='− Pending'}await refreshDiscover();alert('Request submitted — pending.');}catch(e){if(button){button.disabled=false;button.textContent='Request'}alert(e.message)}finally{state.requesting=false}}
    function openIssue(){if(!state.media)return;$('issueMessage').value='';$('issueModal').classList.add('open')}
    function closeIssue(){$('issueModal').classList.remove('open')}
    $('issueSubmit').onclick=async()=>{if(!state.media)return;const b=$('issueSubmit');b.disabled=true;try{await api('/api/seerr/issues',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mediaId:state.media.id,issueType:Number($('issueType').value),message:$('issueMessage').value})});closeIssue();closeMedia();alert('Issue submitted.')}catch(e){alert(e.message)}finally{b.disabled=false}}
    function setView(view){state.view=view;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('discoverView').style.display=view==='discover'||view==='movies'||view==='tv'?'block':'none';$('listView').style.display=view==='requests'||view==='issues'?'block':'none';$('pageTitle').textContent=view==='requests'?'My Requests':view==='issues'?'My Issues':view==='movies'?'Movies':view==='tv'?'TV Shows':'Discover';$('pageSubtitle').textContent=view==='issues'?'Your media issues stored in Seerr.':view==='requests'?'Your request history stored in Seerr and mirrored by Portal.':'Search the configured Seerr catalogue without leaving Portal.';if(view==='requests')loadList('/api/seerr/requests','requests');else if(view==='issues')loadList('/api/seerr/issues','issues');else loadDiscover(view==='movies'?'movie':view==='tv'?'tv':'')}
    async function loadList(url,key){const target=$('listContent');target.innerHTML='<div class="loading">Loading…</div>';try{const d=await api(url);const items=d.results||d.issues||[];if(!items.length){target.innerHTML='<div class="empty">Nothing here yet.</div>';return}target.innerHTML=items.map(item=>{const media=item.media||item;const status=String(item.status||item.issueStatus||'open').toLowerCase();return `<div class="row"><div><strong>${esc(titleFor(item))}</strong><small>${esc(media.mediaType||item.issueType||'Seerr')} · ${esc(item.createdAt||item.created_at||'')}</small></div><span class="status ${status.includes('fail')?'failed':status.includes('pending')?'pending':''}">${esc(status)}</span></div>`}).join('')}catch(e){target.innerHTML=`<div class="error">${esc(e.message)}</div>`}}
    async function loadRequestConfig(){try{state.config=await api('/api/seerr/request-config')}catch(_){state.config={categories:[]}}}
    $('searchButton').onclick=search;$('searchInput').onkeydown=e=>{if(e.key==='Enter')search()};document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>setView(b.dataset.view));const initial=location.hash.slice(1);loadRequestConfig().then(async()=>{await loadRequestStatus();setView(['movies','tv','requests','issues'].includes(initial)?initial:'discover')});
  </script>
</body>
</html>
