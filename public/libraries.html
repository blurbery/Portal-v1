<!doctype html>
<html lang="en">
<head>
<script src="/csrf.js"></script>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My Libraries</title>
  <style>
    :root{--bg:#0a0a0f;--surface:#11111a;--surface2:#191923;--border:#29293a;--text:#ededf5;--muted:#85859f;--accent:#6c63ff;--accent2:#a895ff}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:1.25rem 1rem 2rem}
    .wrap{max-width:900px;margin:0 auto}.eyebrow{color:var(--accent2);font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.title{font-size:1.45rem;font-weight:750;margin:.25rem 0 .35rem}.intro{color:var(--muted);margin:0 0 1.25rem;line-height:1.55}.status{color:var(--muted);padding:2rem;text-align:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.75rem}.library{display:flex;align-items:center;gap:.75rem;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:.85rem;min-height:76px}.library.off{opacity:.58}.icon{width:38px;height:38px;border-radius:10px;background:rgba(108,99,255,.16);color:var(--accent2);display:grid;place-items:center;font-size:1.15rem;flex:0 0 auto}.copy{min-width:0;flex:1}.name{font-weight:700}.state{font-size:.76rem;color:var(--muted);margin-top:.15rem}.toggle{width:42px;height:24px;border:0;border-radius:20px;background:#343447;padding:3px;cursor:pointer;flex:0 0 auto}.toggle i{display:block;width:18px;height:18px;border-radius:50%;background:#9292a7;transition:transform .18s,background .18s}.toggle.on{background:rgba(108,99,255,.65)}.toggle.on i{transform:translateX(18px);background:#fff}.save{margin-top:1.1rem;background:var(--accent);color:#fff;border:0;border-radius:9px;padding:.7rem 1rem;font:inherit;font-weight:700;cursor:pointer}.save:disabled{opacity:.6}.saved{display:inline-block;color:#55d98a;font-size:.8rem;margin-left:.7rem}
    html.light{--bg:#f4f4f8;--surface:#fff;--surface2:#ededf5;--border:#d8d8e5;--text:#181827;--muted:#696980;--accent2:#5d50db}.light .icon{background:rgba(108,99,255,.12)}
    @media(max-width:600px){body{padding:.85rem}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="eyebrow">Emby access</div>
    <h1 class="title">My Libraries</h1>
    <p class="intro">Choose which of your enabled Emby libraries appear in your media areas and library tabs.</p>
    <div id="status" class="status">Loading your libraries…</div>
    <div id="grid" class="grid" hidden></div>
    <button id="save" class="save" hidden onclick="saveLibraries()">Save library settings</button><span id="saved" class="saved"></span>
  </main>
  <script>
    let libraries=[];
    function applyTheme(theme){document.documentElement.classList.toggle('light',theme==='light');}
    window.addEventListener('message',e=>{if(e.data?.type==='theme')applyTheme(e.data.theme);});
    function render(){
      const grid=document.getElementById('grid');
      grid.innerHTML=libraries.map(l=>`<div class="library ${l.enabled?'':'off'}"><div class="icon">▣</div><div class="copy"><div class="name">${esc(l.name)}</div><div class="state">${l.enabled?'Included in your media tabs':'Hidden from your media tabs'}</div></div><button class="toggle ${l.enabled?'on':''}" aria-label="Toggle ${esc(l.name)}" onclick="toggleLibrary('${esc(l.numericId||l.id)}')"><i></i></button></div>`).join('');
      grid.hidden=false;document.getElementById('save').hidden=false;postHeight();
    }
    function toggleLibrary(id){const item=libraries.find(l=>String(l.numericId||l.id)===String(id));if(item){item.enabled=!item.enabled;render();}}
    async function saveLibraries(){
      const button=document.getElementById('save');button.disabled=true;document.getElementById('saved').textContent='Saving…';
      const excludes=libraries.filter(l=>!l.enabled).map(l=>l.numericId||l.id);
      try {
        const r=await fetch('/api/libraries',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({myMediaExcludes:excludes})});
        if(!r.ok)throw Error('Save failed');
        document.getElementById('saved').textContent='Saved';
      } catch(e) { document.getElementById('saved').textContent='Could not save';console.error(e); }
      button.disabled=false;setTimeout(()=>document.getElementById('saved').textContent='',2500);
    }
    function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    function postHeight(){parent.postMessage({type:'librariesHeight',height:document.documentElement.scrollHeight},'*');}
    fetch('/api/libraries',{cache:'no-store'}).then(r=>r.json()).then(d=>{if(d.error)throw Error(d.error);libraries=d.libraries||[];document.getElementById('status').remove();render();}).catch(e=>{document.getElementById('status').textContent='Unable to load your Emby libraries. Please refresh and try again.';console.error(e);});
  </script>
</body>
</html>
