<!doctype html>
<html lang="en"><head>
<script src="/csrf.js"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audiobook — Portal</title>
<style>
body{margin:0;min-height:100vh;background:#0a0a0f;color:#e8e8f0;font:16px system-ui,sans-serif;display:grid;place-items:center}
main{width:min(680px,calc(100% - 2rem));padding:2rem;background:#13131a;border:1px solid #2a2a3a;border-radius:18px;box-shadow:0 18px 60px #0008}
a{color:#a78bfa;text-decoration:none}h1{font-size:1.25rem;margin:0 0 1.5rem}audio{width:100%}.meta{color:#888899;font-size:.85rem;margin-bottom:1rem}
</style></head><body><main><a href="/dashboard">← Back to Portal</a><h1 id="title">Opening audiobook…</h1><div class="meta">Playback position is saved on this device.</div><audio id="player" controls preload="metadata"></audio></main>
<script>
const p=new URLSearchParams(location.search), id=p.get('id')||'', title=p.get('title')||'Audiobook';
const key='portal-audio-progress:'+id, player=document.getElementById('player');
document.getElementById('title').textContent=title;
player.src='/api/library/audiobooks/'+encodeURIComponent(id)+'/stream';
player.addEventListener('loadedmetadata',()=>{const v=Number(localStorage.getItem(key));if(v>0&&v<player.duration-2)player.currentTime=v;});
let timer; player.addEventListener('timeupdate',()=>{clearTimeout(timer);timer=setTimeout(()=>localStorage.setItem(key,String(player.currentTime)),250);});
</script></body></html>
