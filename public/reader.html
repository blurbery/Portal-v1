<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reader — Portal</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0f; --surface: #13131a; --surface2: #1a1a24;
    --border: rgba(255,255,255,0.08); --text: #e8e8f0; --muted: #888899;
    --accent: #6c63ff; --accent2: #a78bfa; --success: #22c55e;
    --sidebar-w: 280px; --topbar-h: 52px;
  }
  html, body { height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; overflow: hidden; }

  /* Top bar */
  #topbar {
    position: fixed; top: 0; left: 0; right: 0; height: var(--topbar-h);
    background: var(--surface); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 0.75rem; padding: 0 1rem; z-index: 100;
  }
  #topbar a { color: var(--muted); text-decoration: none; font-size: 0.85rem; display: flex; align-items: center; gap: 0.4rem; }
  #topbar a:hover { color: var(--text); }
  #bookTitle { font-size: 0.9rem; font-weight: 600; color: var(--text); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #topbar-actions { display: flex; align-items: center; gap: 0.5rem; }
  .tb-btn { background: transparent; border: 1px solid var(--border); border-radius: 8px; color: var(--muted);
    padding: 0.35rem 0.65rem; font-size: 0.78rem; cursor: pointer; font-family: inherit; transition: all 0.15s; white-space: nowrap; }
  .tb-btn:hover { background: var(--surface2); color: var(--text); }
  .tb-btn.active { background: rgba(108,99,255,0.15); color: var(--accent2); border-color: rgba(108,99,255,0.3); }

  /* Layout */
  #layout { display: flex; position: fixed; top: var(--topbar-h); left: 0; right: 0; bottom: 0; }

  /* Sidebar */
  #sidebar {
    width: var(--sidebar-w); background: var(--surface); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; transition: transform 0.25s; overflow: hidden;
    flex-shrink: 0;
  }
  #sidebar.hidden { transform: translateX(calc(-1 * var(--sidebar-w))); width: 0; }
  #sidebar-tabs { display: flex; border-bottom: 1px solid var(--border); }
  .stab { flex: 1; padding: 0.65rem; background: none; border: none; color: var(--muted);
    font-family: inherit; font-size: 0.8rem; font-weight: 500; cursor: pointer;
    border-bottom: 2px solid transparent; transition: all 0.15s; }
  .stab.active { color: var(--accent2); border-bottom-color: var(--accent2); }
  #sidebar-content { flex: 1; overflow-y: auto; padding: 0.5rem 0; }
  .chapter-item { padding: 0.55rem 1rem; font-size: 0.82rem; color: var(--muted); cursor: pointer;
    transition: all 0.12s; border-left: 2px solid transparent; }
  .chapter-item:hover { background: var(--surface2); color: var(--text); }
  .chapter-item.active { color: var(--accent2); border-left-color: var(--accent2); background: rgba(108,99,255,0.08); }
  .bookmark-item { padding: 0.55rem 1rem; font-size: 0.8rem; color: var(--muted); cursor: pointer;
    display: flex; align-items: center; gap: 0.5rem; transition: background 0.12s; }
  .bookmark-item:hover { background: var(--surface2); color: var(--text); }
  .bm-del { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 0.9rem; margin-left: auto; padding: 0 0.25rem; }
  .bm-del:hover { color: #ef4444; }
  .sidebar-empty { padding: 2rem 1rem; text-align: center; color: var(--muted); font-size: 0.82rem; }

  /* Reader area */
  #reader-wrap { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
  #epub-area { flex: 1; overflow: hidden; background: var(--bg); }
  #epub-viewer { width: 100%; height: 100%; }

  /* Nav buttons */
  #nav-prev, #nav-next {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: rgba(255,255,255,0.05); border: 1px solid var(--border);
    color: var(--muted); width: 40px; height: 80px; border-radius: 8px;
    cursor: pointer; font-size: 1.2rem; display: flex; align-items: center;
    justify-content: center; transition: all 0.15s; z-index: 10;
  }
  #nav-prev:hover, #nav-next:hover { background: var(--surface2); color: var(--text); }
  #nav-prev { left: 8px; }
  #nav-next { right: 8px; }

  /* Bottom bar */
  #bottombar {
    height: 42px; background: var(--surface); border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; gap: 1.5rem;
    font-size: 0.78rem; color: var(--muted); padding: 0 1rem; flex-shrink: 0;
  }
  #progress-text { font-weight: 500; color: var(--text); }
  #progress-bar-wrap { flex: 1; max-width: 300px; height: 4px; background: var(--border);
    border-radius: 2px; cursor: pointer; position: relative; }
  #progress-bar { height: 100%; background: var(--accent); border-radius: 2px; width: 0%; transition: width 0.3s; }

  /* Loading overlay */
  #loading-overlay { position: absolute; inset: 0; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; z-index: 50; }
  #loading-overlay.hidden { display: none; }
  .spinner { width: 36px; height: 36px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading-text { color: var(--muted); font-size: 0.9rem; }

  /* Font size control */
  #font-panel { position: absolute; top: calc(var(--topbar-h) + 8px); right: 8px; z-index: 200;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 1rem; display: none; flex-direction: column; gap: 0.75rem; min-width: 200px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
  #font-panel.open { display: flex; }
  .fp-row { display: flex; align-items: center; gap: 0.5rem; font-size: 0.82rem; color: var(--muted); }
  .fp-row label { flex: 1; }
  .fp-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 0.25rem 0.6rem; cursor: pointer; font-family: inherit; font-size: 0.85rem; }
  .fp-btn:hover { background: var(--border); }
  #font-size-val { font-weight: 600; color: var(--text); min-width: 32px; text-align: center; }
  select.fp-select { background: var(--surface2); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 0.25rem 0.5rem; font-family: inherit; font-size: 0.82rem; flex: 1; }

  /* Comic viewer */
  #comic-viewer { display: none; flex: 1; overflow: hidden; align-items: center; justify-content: center;
    background: #000; position: relative; }
  #comic-viewer.active { display: flex; }
  #comic-img { max-width: 100%; max-height: 100%; object-fit: contain; }
  #comic-page-info { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.7); color: #fff; padding: 0.25rem 0.75rem; border-radius: 20px; font-size: 0.78rem; }
</style>
</head>
<body>

<!-- Top bar -->
<div id="topbar">
  <a href="#" id="backBtn" onclick="goBack()">← Back</a>
  <div id="bookTitle">Loading…</div>
  <div id="topbar-actions">
    <button class="tb-btn" id="toggleSidebarBtn" onclick="toggleSidebar()">☰ Chapters</button>
    <button class="tb-btn" id="bookmarkBtn" onclick="addBookmark()">🔖 Bookmark</button>
    <button class="tb-btn" id="fontBtn" onclick="toggleFontPanel()">Aa</button>
  </div>
</div>

<!-- Font panel -->
<div id="font-panel">
  <div class="fp-row">
    <label>Font size</label>
    <button class="fp-btn" onclick="changeFontSize(-2)">−</button>
    <span id="font-size-val">18</span>
    <button class="fp-btn" onclick="changeFontSize(2)">+</button>
  </div>
  <div class="fp-row">
    <label>Theme</label>
    <select class="fp-select" id="themeSelect" onchange="changeTheme(this.value)">
      <option value="dark">Dark</option>
      <option value="light">Light</option>
      <option value="sepia">Sepia</option>
    </select>
  </div>
</div>

<div id="layout">
  <!-- Sidebar -->
  <div id="sidebar">
    <div id="sidebar-tabs">
      <button class="stab active" onclick="showSidebarTab('chapters')">Chapters</button>
      <button class="stab" onclick="showSidebarTab('bookmarks')">Bookmarks</button>
    </div>
    <div id="sidebar-content">
      <div class="sidebar-empty">Loading…</div>
    </div>
  </div>

  <!-- Reader -->
  <div id="reader-wrap">
    <div id="loading-overlay">
      <div class="spinner"></div>
      <div id="loading-text">Opening book…</div>
    </div>

    <div id="epub-area">
      <div id="epub-viewer"></div>
    </div>
    <div id="comic-viewer">
      <img id="comic-img" src="" alt="Page">
      <div id="comic-page-info">1 / 1</div>
    </div>

    <button id="nav-prev" onclick="prevPage()">‹</button>
    <button id="nav-next" onclick="nextPage()">›</button>

    <div id="bottombar">
      <span id="progress-text">—</span>
      <div id="progress-bar-wrap" onclick="seekToPercent(event)">
        <div id="progress-bar"></div>
      </div>
    </div>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const SOURCE_ID = params.get('id') || '';
const BOOK_TITLE = decodeURIComponent(params.get('title') || '');
const BOOK_TYPE = params.get('type') || 'ebook'; // ebook or comic

let book, rendition, chapters = [], bookmarks = [], currentCFI = '', currentChapterIdx = 0;
let fontSize = 18, theme = 'dark', sidebarTab = 'chapters', sidebarVisible = true;
let comicPages = [], comicPage = 0;
let saveTimer = null;

document.getElementById('bookTitle').textContent = BOOK_TITLE;
document.title = BOOK_TITLE + ' — Portal';

const THEMES = {
  dark: { body: { background: '#0a0a0f', color: '#e8e8f0' } },
  light: { body: { background: '#f8f8f2', color: '#1a1a1a' } },
  sepia: { body: { background: '#f4ecd8', color: '#3b2f1e' } },
};

function goBack() {
  saveProgress();
  if (window.opener) {
    window.close();
  } else if (history.length > 1) {
    history.back();
  } else {
    window.location.href = '/dashboard';
  }
}

async function init() {
  try {
    const url = `/api/reader/file/${SOURCE_ID}`;
    // Check file is accessible
    const check = await fetch(url, { method: 'HEAD' }).catch(() => null);
    if (!check || !check.ok) {
      document.getElementById('loading-text').textContent = 'File not found — the book may still be downloading.';
      return;
    }
    const ext = await getFileExtension(SOURCE_ID);
    if (BOOK_TYPE === 'comic' || ['cbz','cbr','zip'].includes(ext)) {
      await initComic(url);
    } else {
      await initEpub(url);
    }
  } catch(e) {
    document.getElementById('loading-text').textContent = 'Error loading book: ' + e.message;
  }
}

async function getFileExtension(source_id) {
  try {
    const r = await fetch(`/api/shelfmark/status/${source_id}`);
    const d = await r.json();
    return (d.filename || '').split('.').pop().toLowerCase();
  } catch(e) { return 'epub'; }
}

// ── EPUB Reader ────────────────────────────────────────────────────────────────
async function initEpub(url) {
  document.getElementById('loading-text').textContent = 'Downloading book…';
  try {
    // Fetch the EPUB as binary data and pass directly to epub.js
    const resp = await fetch(url);
    if (!resp.ok) throw new Error('File not found (status ' + resp.status + ')');
    const buffer = await resp.arrayBuffer();
    document.getElementById('loading-text').textContent = 'Opening book…';

    book = ePub(buffer);
    rendition = book.renderTo('epub-viewer', {
      width: '100%', height: '100%',
      spread: 'none', flow: 'paginated',
    });

  applyTheme();

  // Load saved progress
  const progress = await loadProgress();

  book.ready.then(async () => {
    chapters = await book.navigation.toc || [];
    renderChapters();

    if (progress?.cfi) {
      rendition.display(progress.cfi);
    } else {
      rendition.display();
    }
    if (progress?.bookmarks) {
      bookmarks = progress.bookmarks;
      renderBookmarks();
    }
  });

  rendition.on('relocated', (loc) => {
    currentCFI = loc.start.cfi;
    const pct = Math.round(book.locations.percentageFromCfi(loc.start.cfi) * 100) || 0;
    document.getElementById('progress-bar').style.width = pct + '%';
    document.getElementById('progress-text').textContent = pct + '%';
    highlightCurrentChapter(loc.start.cfi);
    scheduleProgressSave(pct);
    // Show finished banner at 95%+
    if (pct >= 95 && !window._finishedShown) {
      window._finishedShown = true;
      showToast('You\'ve finished this book! It will be removed from the server in 24h.', 'success');
    }
  });

  book.on('openFailed', (err) => {
    document.getElementById('loading-text').textContent = 'Failed to open book: ' + (err?.message || 'unknown error');
    document.getElementById('loading-overlay').style.display = 'flex';
    document.getElementById('loading-overlay').classList.remove('hidden');
  });

  rendition.on('rendered', () => {
    document.getElementById('loading-overlay').classList.add('hidden');
  });

  // Generate locations for progress bar
  book.ready.then(() => book.locations.generate(1024));

  // Keyboard nav
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') nextPage();
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') prevPage();
  });
  } catch(e) {
    document.getElementById('loading-text').textContent = 'Failed to open: ' + e.message;
  }
}

function applyTheme() {
  if (!rendition) return;
  const t = THEMES[theme] || THEMES.dark;
  rendition.themes.override('background', t.body.background);
  rendition.themes.override('color', t.body.color);
  rendition.themes.fontSize(fontSize + 'px');
}

function renderChapters() {
  const c = document.getElementById('sidebar-content');
  if (!chapters.length) { c.innerHTML = '<div class="sidebar-empty">No chapters found.</div>'; return; }
  c.innerHTML = chapters.map((ch, i) =>
    `<div class="chapter-item" id="ch_${i}" onclick="goToChapter(${i})">${ch.label?.trim() || 'Chapter ' + (i+1)}</div>`
  ).join('');
}

function renderBookmarks() {
  if (sidebarTab !== 'bookmarks') return;
  const c = document.getElementById('sidebar-content');
  if (!bookmarks.length) { c.innerHTML = '<div class="sidebar-empty">No bookmarks yet.<br>Click 🔖 to add one.</div>'; return; }
  c.innerHTML = bookmarks.map((bm, i) =>
    `<div class="bookmark-item" onclick="rendition?.display('${bm.cfi}')">
      <span>🔖</span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${bm.label}</span>
      <button class="bm-del" onclick="event.stopPropagation();removeBookmark(${i})">✕</button>
    </div>`
  ).join('');
}

function goToChapter(i) {
  const ch = chapters[i];
  if (ch?.href) rendition?.display(ch.href);
  currentChapterIdx = i;
  highlightCurrentChapter();
}

function highlightCurrentChapter(cfi) {
  document.querySelectorAll('.chapter-item').forEach(el => el.classList.remove('active'));
  const el = document.getElementById(`ch_${currentChapterIdx}`);
  if (el) el.classList.add('active');
}

function addBookmark() {
  if (!currentCFI) { showToast('Nothing to bookmark yet', 'error'); return; }
  const label = `Page ${document.getElementById('progress-text').textContent}`;
  bookmarks.push({ cfi: currentCFI, label, date: new Date().toISOString() });
  renderBookmarks();
  scheduleProgressSave();
  showToast('Bookmark added ✓', 'success');
}

function removeBookmark(i) {
  bookmarks.splice(i, 1);
  renderBookmarks();
  scheduleProgressSave();
}

function prevPage() {
  if (BOOK_TYPE === 'comic') { comicPage = Math.max(0, comicPage - 1); showComicPage(); return; }
  rendition?.prev();
}

function nextPage() {
  if (BOOK_TYPE === 'comic') { comicPage = Math.min(comicPages.length - 1, comicPage + 1); showComicPage(); return; }
  rendition?.next();
}

function seekToPercent(e) {
  if (!book) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  const cfi = book.locations.cfiFromPercentage(pct);
  if (cfi) rendition?.display(cfi);
}

function changeFontSize(delta) {
  fontSize = Math.max(12, Math.min(32, fontSize + delta));
  document.getElementById('font-size-val').textContent = fontSize;
  applyTheme();
}

function changeTheme(t) {
  theme = t;
  applyTheme();
}

function toggleFontPanel() {
  document.getElementById('font-panel').classList.toggle('open');
}

// ── Comic Reader ──────────────────────────────────────────────────────────────
async function initComic(url) {
  document.getElementById('loading-text').textContent = 'Extracting pages…';
  document.getElementById('epub-area').style.display = 'none';
  document.getElementById('comic-viewer').classList.add('active');

  const resp = await fetch(url);
  const buf = await resp.arrayBuffer();
  const zip = await JSZip.loadAsync(buf);

  const imageExts = ['jpg','jpeg','png','gif','webp'];
  comicPages = Object.keys(zip.files)
    .filter(f => imageExts.some(ext => f.toLowerCase().endsWith('.' + ext)))
    .sort();

  if (!comicPages.length) {
    document.getElementById('loading-text').textContent = 'No pages found in this file.';
    return;
  }

  // Build chapter list from folders
  const folders = [...new Set(comicPages.map(p => p.split('/')[0]))].filter(f => comicPages.some(p => p.startsWith(f + '/')));
  chapters = folders.length > 1 ? folders.map((f, i) => ({ label: f, index: i, href: f })) : [];
  renderChapters();

  const progress = await loadProgress();
  comicPage = progress?.page || 0;

  document.getElementById('loading-overlay').classList.add('hidden');
  showComicPage();

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') nextPage();
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') prevPage();
  });

  async function showComicPage() {
    const pageName = comicPages[comicPage];
    const file = zip.files[pageName];
    const blob = await file.async('blob');
    document.getElementById('comic-img').src = URL.createObjectURL(blob);
    document.getElementById('comic-page-info').textContent = `${comicPage + 1} / ${comicPages.length}`;
    const pct = Math.round((comicPage / Math.max(1, comicPages.length - 1)) * 100);
    document.getElementById('progress-bar').style.width = pct + '%';
    document.getElementById('progress-text').textContent = `Page ${comicPage + 1} of ${comicPages.length}`;
    scheduleProgressSave(pct);
  }
  window.showComicPage = showComicPage;
}

// ── Progress persistence ───────────────────────────────────────────────────────
async function loadProgress() {
  try {
    const r = await fetch(`/api/reader/progress/${encodeURIComponent(BOOK_TITLE)}`);
    return await r.json();
  } catch(e) { return {}; }
}

function scheduleProgressSave(pct) {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => saveProgress(pct), 2000);
}

async function saveProgress(pct) {
  try {
    const percentage = pct !== undefined ? pct : parseInt(document.getElementById('progress-text').textContent) || 0;
    await fetch('/api/reader/progress', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        book_title: BOOK_TITLE, source_id: SOURCE_ID,
        cfi: currentCFI, page: comicPage,
        total_pages: comicPages.length || 0,
        bookmarks,
        percentage,
      })
    });
  } catch(e) {}
}

// Save before leaving
window.addEventListener('beforeunload', () => saveProgress());

// ── Sidebar ────────────────────────────────────────────────────────────────────
function toggleSidebar() {
  sidebarVisible = !sidebarVisible;
  document.getElementById('sidebar').classList.toggle('hidden', !sidebarVisible);
  document.getElementById('toggleSidebarBtn').classList.toggle('active', sidebarVisible);
}

function showSidebarTab(tab) {
  sidebarTab = tab;
  document.querySelectorAll('.stab').forEach((el, i) => {
    el.classList.toggle('active', (i === 0 && tab === 'chapters') || (i === 1 && tab === 'bookmarks'));
  });
  if (tab === 'chapters') renderChapters();
  else renderBookmarks();
}

function showToast(msg, type) {
  const t = document.createElement('div');
  t.style.cssText = `position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:${type==='error'?'#ef4444':'#22c55e'};color:#fff;padding:0.5rem 1.2rem;border-radius:20px;font-size:0.82rem;font-weight:600;z-index:999;pointer-events:none`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

init();
</script>
</body>
</html>
