<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password | Portal"><style>
:root{color-scheme:dark;--bg:#0b0c13;--panel:#171827;--line:#303047;--text:#f2f2f5;--muted:#9698aa;--accent:#7168f7}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(ellipse 70% 55% at 4% 2%,rgba(86,76,218,.28),transparent 68%),radial-gradient(ellipse 58% 60% at 97% 98%,rgba(116,45,143,.22),transparent 70%),#0b0c13;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}.wrap{width:min(390px,100%)}.brand{text-align:center;margin-bottom:25px}.brand img{width:38px;height:38px;object-fit:contain;margin-bottom:11px}.brand strong{display:block;font-size:1.15rem}.brand span{display:block;color:#77798a;font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;margin-top:6px}.card{padding:28px;border:1px solid rgba(117,111,247,.35);border-radius:16px;background:linear-gradient(145deg,rgba(28,29,47,.97),rgba(17,18,27,.98));box-shadow:0 24px 70px rgba(0,0,0,.4)}h1{font-size:1.25rem;margin:0 0 8px}.sub{color:var(--muted);font-size:.77rem;line-height:1.5;margin:0 0 20px}label{display:block;color:#b4b6c2;font-size:.7rem;font-weight:700;margin:14px 0 7px}input{width:100%;height:44px;padding:0 12px;border:1px solid var(--line);border-radius:7px;background:#0d0e15;color:var(--text);font:inherit;outline:none}input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(113,104,247,.14)}button{width:100%;height:44px;margin-top:20px;border:0;border-radius:7px;background:linear-gradient(110deg,#635cf0,#7a6df9);color:#fff;font:inherit;font-size:.8rem;font-weight:750;cursor:pointer}.message{display:none;margin-top:13px;padding:10px;border-radius:7px;font-size:.73rem;line-height:1.5}.error{background:rgba(207,75,75,.12);border:1px solid rgba(207,75,75,.28);color:#f29b9b}.ok{background:rgba(67,174,112,.12);border:1px solid rgba(67,174,112,.26);color:#8cddb0}.back{display:block;text-align:center;color:#aaa7ff;text-decoration:none;font-size:.72rem;margin-top:18px}@media(max-width:520px){body{display:block;padding:16px 12px}.wrap{padding-top:30px}.card{padding:22px 18px}input,button{height:48px;font-size:16px}button{font-size:.8rem}}
</style></head><body><main class="wrap"><div class="brand"><img src="/logo.png" alt="Portal"><strong>Portal</strong><span>Member Portal</span></div><section class="card"><h1>Choose a new password</h1><p class="sub" id="intro">Enter a new password for your account.</p><form id="form"><label for="password">New password</label><input id="password" type="password" minlength="6" required><label for="confirm">Confirm password</label><input id="confirm" type="password" minlength="6" required><button id="submit" type="submit">Update password</button><div class="message error" id="error"></div><div class="message ok" id="ok">Password updated. You can now sign in.</div></form><a class="back" href="/">Back to sign in</a></section></main><script>
const token=new URLSearchParams(location.search).get('token'),form=document.getElementById('form'),submit=document.getElementById('submit'),error=document.getElementById('error'),ok=document.getElementById('ok');function fail(t){error.textContent=t;error.style.display='block';form.style.display='none';}if(!token)fail('This reset link is missing or invalid.');else fetch('/api/reset-password/verify?token='+encodeURIComponent(token)).then(r=>r.json()).then(d=>{if(!d.valid)fail(d.expired?'This reset link has expired.':'This reset link is invalid.');else document.getElementById('intro').textContent='Set a new password for '+(d.username||'your account')+'.';}).catch(()=>fail('Unable to verify this reset link.'));form.addEventListener('submit',async e=>{e.preventDefault();error.style.display='none';if(password.value!==confirm.value){error.textContent='Passwords do not match.';error.style.display='block';return}submit.disabled=true;submit.textContent='Updating…';try{const r=await fetch('/api/reset-password/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,newPassword:password.value})});const d=await r.json();if(d.success){form.style.display='none';ok.style.display='block';submit.style.display='none';}else{error.textContent=d.error||'Unable to update password.';error.style.display='block';}}catch(_){error.textContent='Unable to update password.';error.style.display='block'}finally{submit.disabled=false;submit.textContent='Update password'}});
</script></body></html>
